# Caminho do arquivo: .github/workflows/fix-fluxo-propostas-contraproposta_tcc-backend-sharktank.yml

name: Build and deploy ASP.Net Core app to Azure Web App - tcc-backend-sharktank

on:
  push:
    branches:
      - fix/fluxo-propostas-contraproposta
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        # Aponta para o arquivo de solução na raiz para compilar todos os projetos
        run: dotnet build TccSharkTank.sln --configuration Release

      - name: dotnet publish
        # Aponta especificamente para o projeto WebApi e define a pasta de saída
        run: dotnet publish src/TccSharkTank.WebApi/TccSharkTank.WebApi.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_827A8743944B43A7A71F9AFB2608BCA0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_38FB90C0DD534CDDB75A695F7C1ED25F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_45088BA2823F4FF188E7F7AF7BB43194 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tcc-backend-sharktank'
          slot-name: 'Production'
          package: .
